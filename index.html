<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>FACTOR3</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/banner.css">
    <link rel="stylesheet" href="assets/css/categorias.css">
    <link rel="stylesheet" href="assets/css/header.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <script src="assets/js/productos.js"></script>
    <script defer src="assets/js/index.js"></script> 
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
</head> 

<body>
    <header>
        <div class="navigation-header">
            <h1 class="audiowide-regular">FACTOR3</h1>
        </div>
         <div class="search-bar">
            <search>
                <input type="search" id="inputSearch" placeholder="Ingresa el producto a buscar." autocomplete="off">
            </search>
        </div>
        <div class="checkout-header" title="Ir al carrito">
            <span class="material-symbols-outlined search-icon">shopping_cart_checkout</span>
        </div>
    </header>

    <!-- BANNER CARRUSEL -->
    <div class="swiper miCarrusel">
  <div class="swiper-wrapper">
    <!-- IMAGEN DE PRUEBA -->
    <div class="swiper-slide">
        <img src="assets/images/banner1.jpg" alt="Prueba">
    </div>
    <div class="swiper-slide">
        <img src="assets/images/banner2.webp" alt="Prueba">
    </div>
    <div class="swiper-slide">
        <img src="assets/images/31.jpg" alt="Prueba">
    </div>
    
  </div>
  <div class="swiper-button-next"></div>
  <div class="swiper-button-prev"></div>
  <div class="swiper-pagination banner-pagination"></div>
</div>

    <main>
        <!-- CATEGORÍAS (Swiper de categorías) -->
        <div class="swiper swiper-categorias">
            <div class="swiper-wrapper" id="divContainerCategorias">
                <!-- JS inyectará aquí los <div class="swiper-slide"> -->
            </div>
            <!-- Paginación única para categorías -->
            <div class="swiper-pagination categorias-pagination"></div>
        </div>
        
        <div class="products-container"></div>
    </main>

    <footer>
        <div class="footer">
            <h2>&copy; 2026 - Marcos Savid</h2>
            <p>Proyecto modelo utilizado en la materia <strong>INTERFAZ DE DESARROLLO</strong></p>
        </div>
    </footer>
    
    <script>
        // Inicialización del Banner
  window.addEventListener('load', function() {
        new Swiper('.miCarrusel', {
            loop: true,
            slidesPerView: 1, // <--- ESTO ES LO QUE TE FALTA
            spaceBetween: 0,  // Sin espacio entre imágenes
            autoplay: { 
                delay: 3000, 
                disableOnInteraction: false 
            },
            pagination: { el: '.banner-pagination', clickable: true },
            navigation: { 
                nextEl: '.swiper-button-next', 
                prevEl: '.swiper-button-prev' 
            },
        });
    });
    </script>
</body>
</html>
