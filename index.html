<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>FACTOR3</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="shortcut icon" href="assets/images/gadgets-icon.png" type="image/png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/banner.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
      <!--fuente-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <!-- <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> -->
    <script src="assets/js/productos.js"></script>
    <script defer src="assets/js/index.js"></script> 
    <!-- JS de Swiper -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
</head> 

<body>
    <header>
        <div class="navigation-header">
            <h1 class="audiowide-regular">FACTOR3</h1>
            <p>Tu E-Commerce de productos electrónicos favorito.</p>
        </div>
        <div class="checkout-header" title="Ir al carrito">
            <span class="material-symbols-outlined search-icon">
                shopping_cart_checkout
            </span>
        </div>
    </header>
 <!-- Estructura del Carrusel -->
<div class="swiper miCarrusel">
  <div class="swiper-wrapper">
    <div class="swiper-slide"><img src="assets/images/banner1.jpg" alt="Diseño 1"></div>
    <div class="swiper-slide"><img src="assets/images/banner2.webp" alt="Diseño 2"></div>
    <div class="swiper-slide"><img src="assets/images/31.jpg" alt="Diseño 3"></div>
  </div>
  <!-- Navegación -->
  <div class="swiper-button-next"></div>
  <div class="swiper-button-prev"></div>
  <div class="swiper-pagination"></div>
</div>

    <main>
        <div class="search-bar">
            <search>
                <input type="search" 
                       id="inputSearch" 
                       placeholder="Ingresa el producto a buscar."
                       autocomplete="off"
                >
            </search>
        </div>

        <div class="container-categories">
            
        </div>

        <div class="products-container">

        </div>
    </main>

    <footer>
        <div class="footer">
            <h2>&copy; 2026 - Fernando Luna para TECLAB</h2>
            <p>Proyecto modelo utilizado en la materia <strong>INTERFAZ DE DESARROLLO</strong></p>
        </div>
    </footer>
    
</body>
<script>
    const swiper = new Swiper('.miCarrusel', {
  loop: true,
  autoplay: {
    delay: 3000,
    disableOnInteraction: false,
  },
  pagination: {
    el: '.swiper-pagination',
    clickable: true,
  },
  navigation: {
    nextEl: '.swiper-button-next',
    prevEl: '.swiper-button-prev',
  },
});
</script>
</html>
